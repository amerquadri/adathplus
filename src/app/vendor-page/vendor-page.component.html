<app-master-page>
	<!-- Include dialog components in template (hidden) so AOT/compiler recognizes standalone dialog components used only via MatDialog -->
	<mat-card>
		<!-- Header bar: title (left), search (center), actions (right) -->
		<div class="card-header-bar">
			<div class="card-title">
				<mat-card-title>Farmer List</mat-card-title>
			</div>
			<div class="card-actions">
				<mat-form-field appearance="outline" class="header-search">
					<mat-label>Search</mat-label>
					<input matInput [(ngModel)]="searchValue" (keyup)="applyFilter()" placeholder="Search vendors..." class="ocean-input">
				</mat-form-field> 

				<button mat-stroked-button color="primary" (click)="applyFilter()">Search</button>
				<button mat-raised-button color="accent" (click)="openNewVendorDialog()">New</button>

			</div>
		</div>
		<mat-card-content>

			<table mat-table [dataSource]="dataSource" class="mat-elevation-z15">
				<!-- View Column -->
				<ng-container matColumnDef="view">
					<th mat-header-cell *matHeaderCellDef> View </th>
					<td mat-cell *matCellDef="let vendor">
						<button mat-icon-button color="primary" (click)="viewVendor(vendor)"><mat-icon>edit</mat-icon></button>
						<button mat-icon-button color="warn" (click)="confirmDeleteVendor(vendor)"><mat-icon>delete</mat-icon></button>
					</td>
				</ng-container>

				<ng-container matColumnDef="vendorId">
					<th mat-header-cell *matHeaderCellDef> ID </th>
					<td mat-cell *matCellDef="let vendor"> {{vendor.vendorId}} </td>
				</ng-container>

				<ng-container matColumnDef="vendorName">
					<th mat-header-cell *matHeaderCellDef> Name </th>
					<td mat-cell *matCellDef="let vendor"> {{vendor.vendorName}} </td>
				</ng-container>

				<ng-container matColumnDef="phone1">
					<th mat-header-cell *matHeaderCellDef> Phone 1 </th>
					<td mat-cell *matCellDef="let vendor"> {{vendor.phone1}} </td>
				</ng-container>

				<ng-container matColumnDef="email">
					<th mat-header-cell *matHeaderCellDef> Email </th>
					<td mat-cell *matCellDef="let vendor"> {{vendor.email}} </td>
				</ng-container>

				<ng-container matColumnDef="address">
					<th mat-header-cell *matHeaderCellDef> Address </th>
					<td mat-cell *matCellDef="let vendor"> {{vendor.address}} </td>
				</ng-container>

				<ng-container matColumnDef="credit">
					<th mat-header-cell *matHeaderCellDef> Credit </th>
					<td mat-cell *matCellDef="let vendor"> {{vendor.credit}} </td>
				</ng-container>

				<ng-container matColumnDef="debit">
					<th mat-header-cell *matHeaderCellDef> Debit </th>
					<td mat-cell *matCellDef="let vendor"> {{vendor.debit}} </td>
				</ng-container>

				<ng-container matColumnDef="openingAmt">
					<th mat-header-cell *matHeaderCellDef> Opening Amt </th>
					<td mat-cell *matCellDef="let vendor"> {{vendor.openingAmt}} </td>
				</ng-container>

				<ng-container matColumnDef="isActive">
					<th mat-header-cell *matHeaderCellDef> Active </th>
					<td mat-cell *matCellDef="let vendor"> {{vendor.isActive ? 'Yes' : 'No'}} </td>
				</ng-container>

				<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
				<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
				<tr *ngIf="dataSource.data.length === 0">
					<td [attr.colspan]="displayedColumns.length" class="no-record-cell">No record found</td>
				</tr>
			</table>
			<mat-paginator [length]="dataSource.data.length" [pageSize]="5" [pageSizeOptions]="[5,10,20]"
				showFirstLastButtons></mat-paginator>
		</mat-card-content>
	</mat-card>
</app-master-page>

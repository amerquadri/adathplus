<app-master-page>
	<mat-card class="farmer-card">
		<div class="title-bar">Farmer Bill</div>

		<div class="controls">
			<div class="row">
				<div class="col small">
					<mat-form-field appearance="outline" class="ocean-input" class="ocean-input">
						<mat-label>##</mat-label>
						<input matInput type="number" name="FarmerBillId" value="0" placeholder="##" />
					</mat-form-field>
				</div>
				<div class="col small">
					<mat-form-field appearance="outline" class="ocean-input">
						<mat-label>COmmission Bill No</mat-label>
						<input matInput type="text" value="5" name="ComissionBillId" placeholder="Bill No" />
					</mat-form-field>
				</div>
				<div class="col btns">
					<div class="button-group">
						<button mat-raised-button color="primary">Edit</button>
						<button mat-raised-button color="primary">View</button>
					</div>
				</div>

				<div class="col farmer-select">
					<!-- <mat-form-field appearance="outline" class="farmer-select" class="ocean-input">
						<mat-label>Select Farmer</mat-label>
						<mat-select>
							<mat-option value="">--Select--</mat-option>
						</mat-select>
					</mat-form-field> -->

					<!-- <mat-form-field appearance="outline" class="farmer-autocomplete ocean-input">
						<mat-label>Select Farmer</mat-label>
						<input type="text" matInput [formControl]="myControl" [matAutocomplete]="auto" placeholder="Select Farmer">
						<mat-autocomplete #auto="matAutocomplete" (optionSelected)="onVendorSelected($event.option.value)">
							<mat-option *ngFor="let option of filteredOptions | async" [value]="option">{{ option }}</mat-option>
						</mat-autocomplete>
					</mat-form-field> -->


					<mat-form-field class="example-full-width">
						<mat-label>Select Farmer</mat-label>
						<input type="text" name="vendorId" placeholder="Pick one" aria-label="Number" matInput [formControl]="myControl"
							[matAutocomplete]="auto">
						<mat-autocomplete #auto="matAutocomplete" (optionSelected)="onVendorSelected($event.option.value)">
							<mat-option *ngFor="let option of (filteredOptions | async)" [value]="option">{{ option }}</mat-option>
						</mat-autocomplete>
					</mat-form-field>


					<!-- <mat-form-field name="vendorId" placeholder="Farmer Name" appearance="outline">
						<mat-option *ngFor="let vendorItem of vendorList" [value]="vendorItem.vendorId">{{
							vendorItem.vendorName }}
							</mat-option>
					</mat-form-field> -->
				</div>

				<div class="col date">
					<mat-form-field appearance="outline" class="ocean-input">
						<mat-label>Bill Date</mat-label>
						<input matInput [matDatepicker]="picker" placeholder="dd/MM/yyyy" value="14/Dec/2025">
						<mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
						<mat-datepicker #picker></mat-datepicker>
					</mat-form-field>
				</div>
			</div>
		</div>

		<div class="content">
			<div class="table-area">
				<div class="table-header">
					<div class="cell small">#Sr</div>
					<div class="cell">Particular</div>
					<div class="cell small">Qty</div>
					<div class="cell small">Unit</div>
					<div class="cell small">Weight</div>
					<div class="cell small">Rate</div>
					<div class="cell small">Com %</div>
					<div class="cell small">Amt</div>
					<div class="cell small">Delete</div>
				</div>

				<div class="table-body">
					<!-- rows will be rendered here by component logic -->
					<div class="no-rows">No records</div>
				</div>

				<!-- entry row: add new item -->
				<div class="entry-row">
					<div class="entry-left">
						<div class="entry-label">Total</div>
						<div class="entry-records">Records : 0</div>
						<button mat-stroked-button class="enter-btn">Enter</button>
					</div>
					<div class="entry-controls">
						<mat-form-field appearance="outline" class="entry-select">
							<mat-select [(value)]="selectedParticular">
								<mat-option value="Alu">Alu</mat-option>
								<mat-option value="Matar">Matar</mat-option>
								<mat-option value="Pyaz">Pyaz</mat-option>
							</mat-select>
						</mat-form-field>
						<mat-form-field appearance="outline" class="entry-field">
							<input matInput placeholder="Qty" type="number" />
						</mat-form-field>
						<mat-form-field appearance="outline" class="entry-field">
							<input matInput placeholder="Unit" type="number" />
						</mat-form-field>
						<mat-form-field appearance="outline" class="entry-field">
							<input matInput placeholder="Weight" type="number" />
						</mat-form-field>
						<mat-form-field appearance="outline" class="entry-field">
							<input matInput placeholder="Rate" type="number" />
						</mat-form-field>
						<mat-form-field appearance="outline" class="entry-field">
							<input matInput placeholder="ComPer" type="number" />
						</mat-form-field>
						<div class="entry-amount">0.00</div>
						<button mat-flat-button color="accent" class="save-entry">Save</button>
					</div>
				</div>

				<!-- right sidebar with amounts -->
			</div>
			<div class="sidebar">
				<div class="sidebar-box">
					<div class="sidebar-title">रुपय</div>
					<div class="sidebar-list">
						<div class="side-row"><mat-form-field appearance="outline" class="side-field"><input matInput
							placeholder="कमीशन"		value="0"></mat-form-field>
							<div class="side-label">कमीशन</div>
						</div>
						<div class="side-row"><mat-form-field appearance="outline" class="side-field"><input
							placeholder="उच्चल"		matInput></mat-form-field>
							<div class="side-label">उच्चल</div>
						</div>
						<div class="side-row"><mat-form-field appearance="outline" class="side-field"><input
							placeholder="हमाली"		matInput></mat-form-field>
							<div class="side-label">हमाली</div>
						</div>
						<div class="side-row"><mat-form-field appearance="outline" class="side-field"><input
							placeholder="वराई"		matInput></mat-form-field>
							<div class="side-label">वराई</div>
						</div>
						<div class="side-row"><mat-form-field appearance="outline" class="side-field"><input
									placeholder="गाडी भाई"		matInput></mat-form-field>
							<div class="side-label">गाडी भाई</div>
						</div>
						<div class="side-row"><mat-form-field appearance="outline" class="side-field"><input
								placeholder="इतर"		matInput></mat-form-field>
							<div class="side-label">इतर</div>
						</div>
						<div class="side-row"><mat-form-field appearance="outline" class="side-field"><input
									placeholder="बटाव"		matInput></mat-form-field>
							<div class="side-label">बटाव</div>
						</div>
					</div>
					<div class="sidebar-total-row">
						<div class="sidebar-total">0.00</div>
						<div class="sidebar-total-label">Total</div>
					</div>
				</div>
			</div>
		</div>

		<div class="bottom-bar">
			<div class="grand-total">Total:0</div>
			<div class="actions">
				<button mat-raised-button color="primary">New Bill</button>
				<button mat-raised-button color="accent">Save Bill</button>
			</div>
		</div>
	</mat-card>
</app-master-page>

<app-master-page>
	<mat-card>
		<mat-card-header>
			<mat-card-title>User Master</mat-card-title>
		</mat-card-header>
		<mat-dialog-content>
			<form class="customer-dialog-form">
				<div class="form-row">
					<mat-form-field appearance="outline" class="full-width-field">
						<mat-label>Search</mat-label>
						<input matInput placeholder="Search customers..." [(ngModel)]="searchValue" (keyup)="applyFilter()">

					</mat-form-field>
					<div class="phone2-field">
						<button type="button" mat-stroked-button color="primary" (click)="applyFilter()">Search</button>
						<button type="button" mat-raised-button color="accent" (click)="openNew()">New</button>
					</div>
				</div>
				<div class="form-row">
					<div class="user-table">
						<table mat-table [dataSource]="dataSource" class="mat-elevation-z1"  >

							<!-- ID Column -->
							<ng-container matColumnDef="userId">
								<th mat-header-cell *matHeaderCellDef> ID </th>
								<td mat-cell *matCellDef="let user"> {{user.userId}} </td>
							</ng-container>

							<!-- Username Column -->
							<ng-container matColumnDef="userName">
								<th mat-header-cell *matHeaderCellDef> Username </th>
								<td mat-cell *matCellDef="let user"> {{user.userName}} </td>
							</ng-container>

							<!-- Full Name -->
							<ng-container matColumnDef="userFullName">
								<th mat-header-cell *matHeaderCellDef> Name </th>
								<td mat-cell *matCellDef="let user"> {{user.userFullName}} </td>
							</ng-container>

							<!-- Email -->
							<ng-container matColumnDef="email">
								<th mat-header-cell *matHeaderCellDef> Email </th>
								<td mat-cell *matCellDef="let user"> {{user.email}} </td>
							</ng-container>

							<!-- Mobile -->
							<ng-container matColumnDef="mobile">
								<th mat-header-cell *matHeaderCellDef> Mobile </th>
								<td mat-cell *matCellDef="let user"> {{user.mobile}} </td>
							</ng-container>

							<!-- Admin -->
							<ng-container matColumnDef="isAdmin">
								<th mat-header-cell *matHeaderCellDef> Admin </th>
								<td mat-cell *matCellDef="let user"> {{user.isAdmin ? 'Yes' : 'No'}} </td>
							</ng-container>

							<!-- Status -->
							<ng-container matColumnDef="status">
								<th mat-header-cell *matHeaderCellDef> Status </th>
								<td mat-cell *matCellDef="let user"> {{user.status}} </td>
							</ng-container>

							<!-- Company -->
							<ng-container matColumnDef="companyName">
								<th mat-header-cell *matHeaderCellDef> Company </th>
								<td mat-cell *matCellDef="let user"> {{user.companyName}} </td>
							</ng-container>

							<!-- isactve -->
							<ng-container matColumnDef="isActive">
								<th mat-header-cell *matHeaderCellDef> Is Active </th>
								<td mat-cell *matCellDef="let user"> {{user.isActive}} </td>
							</ng-container>
						 

							<!-- Actions -->
							<ng-container matColumnDef="actions" >
								<th mat-header-cell *matHeaderCellDef> Actions </th>
								<td mat-cell *matCellDef="let user">
									<button type="button" mat-icon-button aria-label="Edit user" (click)="openEdit(user)"><mat-icon>edit</mat-icon></button>
									<button type="button" mat-icon-button aria-label="Delete user" (click)="deleteUser(user.userId)"><mat-icon>delete</mat-icon></button>
								</td>
							</ng-container>

							<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
							<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
						</table>
					</div>
				</div>
			</form>
		</mat-dialog-content>
	</mat-card>
</app-master-page>

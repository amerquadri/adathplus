<mat-card class="login-card" align="center" vertical-align="middle" style="padding: 20px; max-width: 400px; margin: auto; margin-top: 100px;">
<h1> Testing Ocean........... </h1>
<div style="display: flex; flex-direction: column; align-items: center;">
		<svg width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="login-svg">
			<circle cx="12" cy="8" r="4" fill="#1976d2"/>
			<path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="#1976d2"/>
		</svg>
		<h2 class="login-title">Login</h2>
	</div>
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
		<mat-form-field appearance="fill" class="full-width">
			<mat-label>Username</mat-label>
			<input matInput formControlName="username" required placeholder="Enter your username">
			<mat-error *ngIf="loginForm.get('username')?.hasError('required')">
				Username is required
			</mat-error>
		</mat-form-field>
<br>
		<mat-form-field appearance="fill" class="full-width">
			<mat-label>Password</mat-label>
			<input matInput type="password" formControlName="password" required placeholder="Enter your password">
					<mat-error *ngIf="loginForm.get('password')?.hasError('required')">
						Password is required
					</mat-error>
		</mat-form-field>
<br>
		<button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid">Login</button>
	</form>

</mat-card>

<footer class="app-footer">
  <div class="footer-content">
    <!-- Left Section - Copyright -->
    <div class="footer-left">
      <div class="brand-info">
        <span class="brand-icon">📊</span>
        <span class="brand-name">AdathPlus</span>
      </div>
      <span class="copyright">© {{ currentYear }} All rights reserved</span>
    </div>

    <!-- Center Section - Quick Links (optional) -->
    <div class="footer-center">
      <span class="footer-link">Privacy Policy</span>
      <span class="separator">•</span>
      <span class="footer-link">Terms of Service</span>
      <span class="separator">•</span>
      <span class="footer-link">Help</span>
    </div>

    <!-- Right Section - User Info -->
    <div class="footer-right">
      <div class="user-session">
        <div class="session-item">
          <span class="session-icon">👤</span>
          <span class="session-value">{{ userInfo.userFullName || 'Guest' }}</span>
        </div>
        <div class="session-divider"></div>
        <div class="session-item">
          <span class="session-icon">🏢</span>
          <span class="session-value">{{ userInfo.companyName || 'N/A' }}</span>
        </div>
        <div class="session-divider"></div>
        <div class="session-item">
          <span class="session-icon">🕐</span>
          <span class="session-value">{{ userInfo.loginTime | date:'short' }}</span>
        </div>
      </div>
    </div>
  </div>
</footer>

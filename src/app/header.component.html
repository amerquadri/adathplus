<header class="app-header  box-shadow">
  <div class=" box-shadow">
    <div class="header-content">
      <nav class="nav-buttons">
        <button mat-button (click)="goToHome()"> Home</button>
        <button mat-flat-button [matMenuTriggerFor]="menu1">Master</button>
        <mat-menu #menu1="matMenu">
          <button mat-menu-item (click)="goToCustomer()">Customer</button>
          <button mat-menu-item (click)="goToCustomertest()">Farmer</button>
          <button mat-menu-item (click)="goToVendor()">Vendor</button>
          <button mat-menu-item (click)="goToItem()">Item</button>
        </mat-menu>
        <button mat-button [matMenuTriggerFor]="Bill">Bill</button>
         <mat-menu #Bill="matMenu">
          <button mat-menu-item (click)="goToCustomer()">Farmer</button>
          <button mat-menu-item (click)="goToCustomertest()">Customer</button>
          <button mat-menu-item (click)="goToVendor()">Vendor</button>
          <button mat-menu-item (click)="goToItem()">Item</button>
        </mat-menu>
        <button mat-button [matMenuTriggerFor]="Payment">Payment</button>
         <mat-menu #Payment="matMenu">
          <button mat-menu-item (click)="goToCustomer()">Customer</button>
          <button mat-menu-item (click)="goToCustomertest()">Farmer</button>
         
        </mat-menu>
        <button mat-button>Test 2</button>
      </nav>

      <h1>My App Header</h1>

      <!-- Sign in / user menu -->
      <div class="auth-area">
        <ng-container *ngIf="!isSignedIn; else signedInTpl">
          <button mat-raised-button color="primary" (click)="signIn()">Sign In</button>
        </ng-container>
        <ng-template #signedInTpl>
          <button mat-button [matMenuTriggerFor]="userMenu">
            <mat-icon>account_circle</mat-icon>
            {{ userName || 'User' }}
          </button>
          <mat-menu #userMenu="matMenu">
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              Sign Out
            </button>
          </mat-menu>
        </ng-template>
      </div>
      
      <!-- Scale control -->
      <div class="scale-control">
        <button mat-stroked-button color="primary" (click)="toggleScale()">
          Scale 80%
        </button>
      </div>

      <!-- Quick logout button (visible when signed in) -->
      <div class="quick-logout" *ngIf="isSignedIn">
        <button mat-raised-button color="warn" class="logout-button" (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>
  </div>
</header>
